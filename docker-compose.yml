version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # allow managing local docker
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    # Note: For some operations you may need extra privileges; avoid --privileged unless necessary
    #privileged: true

